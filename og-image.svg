<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Compute4Cure.org social preview</title>
  <desc id="desc">A clean social preview image for Compute4Cure.org with the original power-button logo, large headline, and readable impact stats.</desc>
  <defs>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70be40"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="#f8fafc" opacity="0.94"/>

  <g opacity="0.48" stroke="#e2e8f0" stroke-width="1">
    <path d="M0 112H1200"/>
    <path d="M0 224H1200"/>
    <path d="M0 336H1200"/>
    <path d="M0 448H1200"/>
    <path d="M0 560H1200"/>
    <path d="M152 0V630"/>
    <path d="M304 0V630"/>
    <path d="M456 0V630"/>
    <path d="M608 0V630"/>
    <path d="M760 0V630"/>
    <path d="M912 0V630"/>
    <path d="M1064 0V630"/>
  </g>

  <g transform="translate(70 58)">
    <image href="assets/logo.png" xlink:href="assets/logo.png" x="0" y="-4" width="92" height="96" preserveAspectRatio="xMidYMid meet"/>
    <text x="118" y="41" font-family="Sora, Manrope, DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="700" fill="#173c5a">Compute<tspan fill="#70be40">4</tspan>Cure.org</text>
    <text x="120" y="76" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="800" fill="#64748b">Open science, powered by donated compute</text>

    <rect x="760" y="6" width="302" height="54" rx="27" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="790" cy="33" r="7" fill="#70be40"/>
    <text x="810" y="40" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="900" fill="#173c5a">TEAM #1067730</text>
  </g>

  <g transform="translate(70 232)">
    <text x="0" y="0" font-family="Sora, Manrope, DejaVu Sans, Arial, sans-serif" font-size="84" font-weight="700" fill="#0f172a">Donated compute</text>
    <text x="0" y="96" font-family="Sora, Manrope, DejaVu Sans, Arial, sans-serif" font-size="84" font-weight="700" fill="#173c5a">for open science</text>
    <text x="0" y="158" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="800" fill="#475569">Volunteer hardware. Complete Folding@home work units.</text>
  </g>

  <g transform="translate(70 466)">
    <rect x="0" y="0" width="330" height="94" rx="22" fill="#173c5a"/>
    <text x="28" y="45" font-family="Sora, Manrope, DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">560M+</text>
    <text x="30" y="75" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="900" fill="#d9eef7">Folding@home points</text>

    <rect x="365" y="0" width="330" height="94" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="393" y="45" font-family="Sora, Manrope, DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="700" fill="#173c5a">10,000+</text>
    <text x="395" y="75" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="900" fill="#64748b">computer-hours</text>

    <rect x="730" y="0" width="330" height="94" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="758" y="45" font-family="Sora, Manrope, DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="700" fill="#173c5a">2,100+</text>
    <text x="760" y="75" font-family="Manrope, DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="900" fill="#64748b">work units</text>

    <rect x="0" y="126" width="1060" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="0" y="126" width="594" height="18" rx="9" fill="url(#progress)"/>
  </g>
